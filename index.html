<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Viper Radar · live aircraft on a retro radar scope</title>
  <meta name="description" content="A retro radar scope showing live aircraft from the OpenSky Network, with sweep painting, phosphor decay and dead reckoning.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23020905' stroke='%233dff7a' stroke-width='2'/><path d='M16 16 L16 3' stroke='%233dff7a' stroke-width='2'/><circle cx='22' cy='11' r='2' fill='%233dff7a'/></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <h1 class="brand"><span aria-hidden="true">◉</span> VIPER RADAR</h1>
    <div class="controls">
      <label>Site <select id="region"></select></label>
      <div class="seg" id="range" role="group" aria-label="Range in nautical miles">
        <button type="button" data-nm="20">20</button>
        <button type="button" data-nm="40">40</button>
        <button type="button" data-nm="80">80</button>
        <button type="button" data-nm="120">120 nm</button>
      </div>
      <label>Feed
        <select id="source">
          <option value="auto">Auto</option>
          <option value="sim">Simulated</option>
        </select>
      </label>
      <label class="check"><input type="checkbox" id="labels" checked> Labels</label>
    </div>
  </header>

  <main>
    <div class="scope-wrap">
      <canvas id="scope" role="img" aria-label="Radar scope showing aircraft around the selected site"></canvas>
    </div>
    <aside class="side">
      <section>
        <div id="status" class="status acquiring">● ACQUIRING</div>
        <p id="status-detail" class="muted">Contacting OpenSky…</p>
      </section>
      <section>
        <h2>Selected</h2>
        <div id="detail" class="muted">Click a blip or a row below.</div>
      </section>
      <section class="contacts">
        <h2>Contacts <span id="count"></span></h2>
        <table>
          <thead><tr><th>Callsign</th><th>Alt</th><th>Kt</th><th>Rng/Brg</th></tr></thead>
          <tbody id="contacts-body"></tbody>
        </table>
      </section>
    </aside>
  </main>

  <footer>
    Aircraft data: <a href="https://opensky-network.org" target="_blank" rel="noopener">The OpenSky Network</a>
    · For fun, not for navigation
    · <a href="https://github.com/Viepertech/viper-radar" target="_blank" rel="noopener">Source</a>
  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
